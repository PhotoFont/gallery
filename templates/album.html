<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ album_name }} - Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <a href="/" class="text-blue-400 hover:underline mb-4 inline-block">&larr; Back to Albums</a>
        <h1 class="text-3xl font-bold mb-8 border-b border-gray-700 pb-4">{{ album_name }}</h1>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            {% for image in images %}
            <div class="aspect-square bg-gray-800 rounded-lg overflow-hidden">
                <a href="/gallery/{{ album_name }}/{{ image }}" target="_blank">
                    <img src="/gallery/{{ album_name }}/{{ image }}" class="w-full h-full object-cover hover:opacity-85 transition">
                </a>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>

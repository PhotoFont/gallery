<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold mb-8 border-b border-gray-700 pb-4">Gallery Albums</h1>
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            {% for album in albums %}
            <a href="/album/{{ album.name }}" class="group bg-gray-800 rounded-xl overflow-hidden shadow-lg hover:shadow-2xl transition duration-300">
                <div class="aspect-square bg-gray-700 overflow-hidden relative">
                    {% if album.cover %}
                    <img src="/gallery/{{ album.name }}/{{ album.cover }}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                    {% else %}
                    <div class="flex items-center justify-center h-full text-gray-500">No Image</div>
                    {% endif %}
                </div>
                <div class="p-4">
                    <h2 class="font-semibold text-lg truncate">{{ album.name }}</h2>
                    <p class="text-gray-400 text-sm">{{ album.count }} photos</p>
                </div>
            </a>
            {% endfor %}
        </div>
    </div>
</body>
</html>
